<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memória Viva - Preciso de Ajuda</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .ajuda-container {
            max-width: 480px;
            width: 100%;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            text-align: center;
        }
        .aviso-card {
            background-color: #FFF3CD;
            border: 1px solid #FFEEBA;
            color: #856404;
            padding: 15px;
            border-radius: 12px;
            font-size: 1rem;
            line-height: 1.4;
            width: 100%;
            box-sizing: border-box;
        }
        .btn-emergencia {
            background-color: #b05c9a;
            color: white;
            width: 100%;
            padding: 20px;
            border-radius: 15px;
            text-decoration: none;
            font-size: 1.3rem;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(176, 92, 154, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background-color 0.2s;
        }
        .btn-emergencia:hover {
            background-color: #9c4b86;
        }
        .btn-ligar {
            background-color: #4a919e;
            color: white;
            width: 100%;
            padding: 18px;
            border-radius: 15px;
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(74, 145, 158, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background-color 0.2s;
        }
        .btn-ligar:hover {
            background-color: #3b7580;
        }
        .contato-info {
            background-color: #FFF;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            width: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .btn-voltar {
            background-color: #ccc;
            color: #333;
            text-align: center;
            padding: 12px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            display: block;
            width: 100%;
            box-sizing: border-box;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container" style="flex-direction: row; gap: 10px; margin: 0;">
            <img src="img/logo.jpg" alt="Logo" style="width: 40px; margin: 0;" onerror="this.style.display='none'">
            <span style="font-size: 1.2rem;">Memória Viva</span>
        </div>
        <a href="home-paciente.html" style="color: var(--primary-color); text-decoration: none; font-weight: bold; font-size: 0.9rem;">Voltar</a>
    </header>

</body>
</html>
