<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memória Viva - Minhas Memórias</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .memorias-container {
            max-width: 480px;
            width: 100%;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .memoria-card {
            background-color: #FFF;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border-left: 5px solid #b05c9a;
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
        }
        .memoria-cabecalho {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .memoria-ano {
            font-size: 0.9rem;
            color: #b05c9a;
            font-weight: bold;
        }
        .btn-lixeira {
            background: none;
            border: none;
            color: #d9534f;
            cursor: pointer;
            font-size: 1.1rem;
            padding: 2px 5px;
            border-radius: 4px;
            transition: background-color 0.2s;
        }
        .btn-lixeira:hover {
            background-color: #fdf2f2;
        }
        .memoria-titulo {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--text-color);
        }
        .memoria-texto {
            font-size: 1rem;
            color: #555;
            line-height: 1.5;
            margin: 0;
        }
        .btn-adicionar {
            background-color: #b05c9a;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 2px 5px rgba(176, 92, 154, 0.3);
            transition: background-color 0.2s;
        }
        .btn-adicionar:hover {
            background-color: #9c4b86;
        }
        .btn-voltar {
            background-color: #ccc;
            color: #333;
            text-align: center;
            padding: 12px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            display: block;
            margin-top: 10px;
        }
        
        /* Modal de Nova Memória */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
            box-sizing: border-box;
        }
        .modal-card {
            background-color: white;
            padding: 20px;
            border-radius: 15px;
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .modal-card input, .modal-card textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 0.95rem;
            box-sizing: border-box;
            background-color: #f9f9f9;
            color: #333;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container" style="flex-direction: row; gap: 10px; margin: 0;">
            <img src="img/logo.jpg" alt="Logo" style="width: 40px; margin: 0;" onerror="this.style.display='none'">
            <span style="font-size: 1.2rem;">Memória Viva</span>
        </div>
        <a href="home-paciente.html" style="color: var(--primary-color); text-decoration: none; font-weight: bold; font-size: 0.9rem;">Voltar</a>
    </header>

</body>
</html>
