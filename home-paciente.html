<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memória Viva - Início</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .home-container {
            max-width: 480px;
            width: 100%;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-sizing: border-box;
        }
        .frase-card {
            background-color: #FFF;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border-left: 5px solid #b05c9a;
            text-align: center;
            font-size: 1.05rem;
            font-style: italic;
            color: var(--text-color);
        }
        .btn-menu-card {
            background-color: #4a919e;
            color: white;
            text-align: center;
            padding: 18px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: block;
            transition: background-color 0.2s;
        }
        .btn-menu-card:hover {
            background-color: #3b7580;
        }
        .btn-urgent {
            background-color: #b05c9a;
        }
        .btn-urgent:hover {
            background-color: #9c4b86;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container" style="flex-direction: row; gap: 10px; margin: 0;">
            <img src="img/logo.png" alt="Logo" style="width: 40px; margin: 0;" onerror="this.style.display='none'">
            <span style="font-size: 1.2rem;">Memória Viva</span>
        </div>
        <a href="index.html" style="color: #b05c9a; text-decoration: none; font-weight: bold; font-size: 0.9rem;">Sair</a>
    </header>

</body>
</html>
