<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memória Viva - Rotina e Medicamentos</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .rotina-container {
            max-width: 480px;
            width: 100%;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .card-item {
            background-color: #FFF;
            padding: 18px;
            border-radius: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 5px solid var(--primary-color);
        }
        .card-item.medicamento {
            border-left-color: var(--accent-color);
        }
        .card-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
        }
        .card-titulo {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--text-color);
        }
        .card-horario {
            font-size: 0.95rem;
            color: #666;
            font-weight: 600;
        }
        .btn-excluir {
            background-color: #ff4d4d;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            transition: background 0.2s;
        }
        .btn-excluir:hover {
            background-color: #cc0000;
        }
        .btn-voltar {
            background-color: #ccc;
            color: #333;
            text-align: center;
            padding: 12px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            display: block;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container" style="flex-direction: row; gap: 10px; margin: 0;">
            <img src="img/logo.png" alt="Logo" style="width: 40px; margin: 0;" onerror="this.style.display='none'">
            <span style="font-size: 1.2rem;">Memória Viva</span>
        </div>
        <a href="home-paciente.html" style="color: var(--primary-color); text-decoration: none; font-weight: bold; font-size: 0.9rem;">Voltar</a>
    </header>

    <div class="rotina-container">
        <h1 style="font-size: 1.5rem; text-align: center; color: var(--text-color); margin-bottom: 5px;">Sua Rotina de Hoje</h1>
        
        <!-- Onde a lista dinâmica vai aparecer -->
        <div id="lista-rotinas" style="display: flex; flex-direction: column; gap: 15px;">
            <!-- Preenchido via JavaScript -->
        </div>

        <a href="home-paciente.html" class="btn-voltar">Voltar para o Início</a>
    </div>

    <footer>
        &copy; 2026 Memória Viva. Todos os direitos reservados.
    </footer>

    <script>
        function carregarRotinas() {
            const rotinasPadrao = [
                { horario: "09:00 - Manhã", titulo: "Café da manhã com a família", tipo: "compromisso" },
                { horario: "12:00 - Almoço", titulo: "Tomar remédio de pressão (1 comprimido azul)", tipo: "medicamento" },
                { horario: "15:00 - Tarde", titulo: "Caminhada leve no jardim", tipo: "compromisso" }
            ];

            let rotinasSalvas = JSON.parse(localStorage.getItem('memoria_viva_rotinas')) || rotinasPadrao;
            const containerLista = document.getElementById('lista-rotinas');
            containerLista.innerHTML = ''; 

            if (rotinasSalvas.length === 0) {
                containerLista.innerHTML = '<p style="text-align: center; color: #666;">Nenhuma rotina cadastrada no momento.</p>';
                return;
            }

            rotinasSalvas.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = item.tipo === 'medicamento' ? 'card-item medicamento' : 'card-item';
                
                const icone = item.tipo === 'medicamento' ? '💊' : '⏰';

                card.innerHTML = `
                    <div class="card-info">
                        <span class="card-horario">${icone} ${item.horario}</span>
                        <span class="card-titulo">${item.titulo}</span>
                    </div>
                    <button class="btn-excluir" onclick="deletarRotina(${index})">🗑️ Excluir</button>
                `;
                containerLista.appendChild(card);
            });
        }

        // Função para deletar um item específico pelo seu índice na lista
        function deletarRotina(index) {
            let rotinasSalvas = JSON.parse(localStorage.getItem('memoria_viva_rotinas')) || [];
            
            if (confirm("Deseja realmente remover este item da rotina?")) {
                rotinasSalvas.splice(index, 1); // Remove o item da posição 'index'
                localStorage.setItem('memoria_viva_rotinas', JSON.stringify(rotinasSalvas)); // Salva a lista atualizada
                carregarRotinas(); // Recarrega a tela para atualizar os cards
            }
        }

        // Executa ao carregar a página
        window.onload = carregarRotinas;
    </script>
</body>
</html>
