<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memória Viva - Cadastro</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .opcao-grupo {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
            cursor: pointer;
        }
        .opcao-grupo input[type="radio"] {
            width: auto !important;
            margin: 0;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="img/logo.png" alt="Logo Memória Viva" onerror="this.style.display='none'">
            <span>Memória Viva</span>
        </div>
    </header>

</body>
</html>
