<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memória Viva - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="img/logo.png" alt="Logo Memória Viva" onerror="this.style.display='none'">
            <span>Memória Viva</span>
        </div>
    </header>

    <div class="main-container">
        <p style="text-align: center; color: #555; margin-bottom: 5px; font-weight: 500;">BEM-VINDO AO MEMÓRIA VIVA,</p>
        <h1 style="font-size: 2.2rem; margin-bottom: 25px; text-align: center; color: var(--text-color);">LOGIN:</h1>

        <form id="form-login-paciente">
            <input type="text" id="login-nome" placeholder="Nome do usuário" required>
            <input type="password" id="login-senha" placeholder="Senha" required>
            
            <button type="submit" class="btn-primary">Fazer login</button>
        </form>

        <div class="auth-links">
            <a href="esqueci-senha.html">Esqueceu a senha? Clique aqui</a>
            <a href="login-cuidador.html">É cuidador? Faça seu login aqui</a>
            <a href="cadastro.html" style="color: var(--secondary-color); margin-top: 10px;">Não tem uma conta? Cadastre-se</a>
        </div>
    </div>

    <footer>
        &copy; 2026 Memória Viva. Todos os direitos reservados.
    </footer>
    
</body>
</html>
