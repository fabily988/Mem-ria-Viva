<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memória Viva - Exercícios de Memória</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .exercicios-container {
            max-width: 480px;
            width: 100%;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .exercicio-card {
            background-color: #FFF;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border-left: 5px solid #4a919e;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .pergunta-titulo {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--text-color);
        }
        .exercicio-card input {
            background-color: #f9f9f9;
            color: #333 !important;
            border: 1px solid #ccc;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
        }
        .resposta-feedback {
            font-size: 0.95rem;
            font-weight: bold;
            margin-top: 5px;
            display: none;
        }
        .btn-verificar {
            background-color: #4a919e;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.95rem;
        }
        .btn-verificar:hover {
            background-color: #3b7580;
        }
        .btn-voltar {
            background-color: #ccc;
            color: #333;
            text-align: center;
            padding: 12px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            display: block;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container" style="flex-direction: row; gap: 10px; margin: 0;">
            <img src="img/logo.png" alt="Logo" style="width: 40px; margin: 0;" onerror="this.style.display='none'">
            <span style="font-size: 1.2rem;">Memória Viva</span>
        </div>
        <a href="home-paciente.html" style="color: var(--primary-color); text-decoration: none; font-weight: bold; font-size: 0.9rem;">Voltar</a>
    </header>

</body>
</html>
