<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memória Viva - Minhas Memórias</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .memorias-container {
            max-width: 480px;
            width: 100%;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .memoria-card {
            background-color: #FFF;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border-left: 5px solid #b05c9a;
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
        }

        .memoria-cabecalho {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .memoria-ano {
            font-size: 0.9rem;
            color: #b05c9a;
            font-weight: bold;
        }

        .btn-lixeira {
            background: none;
            border: none;
            color: #d9534f;
            cursor: pointer;
            font-size: 1.1rem;
            padding: 2px 5px;
            border-radius: 4px;
            transition: background-color 0.2s;
        }

        .btn-lixeira:hover {
            background-color: #fdf2f2;
        }

        .memoria-titulo {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--text-color);
        }

        .memoria-texto {
            font-size: 1rem;
            color: #555;
            line-height: 1.5;
            margin: 0;
        }

        .btn-adicionar {
            background-color: #b05c9a;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 2px 5px rgba(176, 92, 154, 0.3);
            transition: background-color 0.2s;
        }

        .btn-adicionar:hover {
            background-color: #9c4b86;
        }

        .btn-voltar {
            background-color: #ccc;
            color: #333;
            text-align: center;
            padding: 12px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            display: block;
            margin-top: 10px;
        }
        
        /* Modal de Nova Memória */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-card {
            background-color: white;
            padding: 20px;
            border-radius: 15px;
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .modal-card input, .modal-card textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 0.95rem;
            box-sizing: border-box;
            background-color: #f9f9f9;
            color: #333;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container" style="flex-direction: row; gap: 10px; margin: 0;">
            <img src="img/logo.jpg" alt="Logo" style="width: 40px; margin: 0;" onerror="this.style.display='none'">
            <span style="font-size: 1.2rem;">Memória Viva</span>
        </div>
        <a href="home-paciente.html" style="color: var(--primary-color); text-decoration: none; font-weight: bold; font-size: 0.9rem;">Voltar</a>
    </header>

    <div class="memorias-container">
        <h1 style="font-size: 1.5rem; text-align: center; color: var(--text-color); margin-bottom: 0;">Minhas Memórias</h1>
        <p style="text-align: center; color: #666; font-size: 0.95rem; margin-top: -5px; margin-bottom: 5px;">Histórias marcantes e especiais da sua vida.</p>
        
        <!-- Botão Criar Memória -->
        <button class="btn-adicionar" onclick="abrirModal()">
            <span>➕</span> Criar Nova Memória
        </button>

        <!-- Lista de Memórias -->
        <div id="lista-memorias" style="display: flex; flex-direction: column; gap: 15px;">
            <!-- Preenchido via JavaScript -->
        </div>

        <a href="home-paciente.html" class="btn-voltar">Voltar para o Início</a>
    </div>

    <!-- Modal Formulario -->
    <div id="modal-memoria" class="modal-overlay">
        <div class="modal-card">
            <h2 style="font-size: 1.2rem; color: var(--text-color); margin: 0; text-align: center;">Nova Memória</h2>
            
            <label style="font-size: 0.85rem; font-weight: bold; color: #555;">Ano (ex: 1980):</label>
            <input type="text" id="novo-ano" placeholder="Ex: 1985">

            <label style="font-size: 0.85rem; font-weight: bold; color: #555;">Título:</label>
            <input type="text" id="novo-titulo" placeholder="Ex: Nascimento do meu neto">

            <label style="font-size: 0.85rem; font-weight: bold; color: #555;">História / Lembrança:</label>
            <textarea id="nova-descricao" rows="3" placeholder="Escreva sobre esse momento..."></textarea>

            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button onclick="fecharModal()" style="flex: 1; padding: 10px; border-radius: 8px; border: none; background-color: #ccc; cursor: pointer; font-weight: bold;">Cancelar</button>
                <button onclick="salvarMemoria()" style="flex: 1; padding: 10px; border-radius: 8px; border: none; background-color: #b05c9a; color: white; cursor: pointer; font-weight: bold;">Salvar</button>
            </div>
        </div>
    </div>

    <footer>
        &copy; 2026 Memória Viva. Todos os direitos reservados.
    </footer>

    <script>
        const memoriasPadrao = [
            {
                ano: "1975",
                titulo: "O Casamento",
                descricao: "Um dia inesquecível celebrado com toda a família e amigos na igrejinha do bairro."
            },
            {
                ano: "1982",
                titulo: "A Viagem para a Praia",
                descricao: "A primeira viagem de férias com as crianças para o litoral. Muita alegria na areia."
            },
            {
                ano: "1995",
                titulo: "A Casa Nova",
                descricao: "A conquista da casa própria com um quintal cheio de árvores e flores."
            }
        ];

        function carregarMemorias() {
            let memorias = JSON.parse(localStorage.getItem('memoria_viva_memorias')) || memoriasPadrao;
            
            // Garante inicialização no localStorage se for a primeira vez
            if (!localStorage.getItem('memoria_viva_memorias')) {
                localStorage.setItem('memoria_viva_memorias', JSON.stringify(memoriasPadrao));
            }

            const container = document.getElementById('lista-memorias');
            container.innerHTML = '';

            memorias.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'memoria-card';
                card.innerHTML = `
                    <div class="memoria-cabecalho">
                        <span class="memoria-ano">🖼️ ${item.ano}</span>
                        <button class="btn-lixeira" onclick="excluirMemoria(${index})" title="Excluir memória">🗑️</button>
                    </div>
                    <span class="memoria-titulo">${item.titulo}</span>
                    <p class="memoria-texto">${item.descricao}</p>
                `;
                container.appendChild(card);
            });
        }

        function abrirModal() {
            document.getElementById('modal-memoria').style.display = 'flex';
        }

        function fecharModal() {
            document.getElementById('modal-memoria').style.display = 'none';
            document.getElementById('novo-ano').value = '';
            document.getElementById('novo-titulo').value = '';
            document.getElementById('nova-descricao').value = '';
        }

        function salvarMemoria() {
            const ano = document.getElementById('novo-ano').value.trim();
            const titulo = document.getElementById('novo-titulo').value.trim();
            const descricao = document.getElementById('nova-descricao').value.trim();

            if (!ano || !titulo || !descricao) {
                alert("Por favor, preencha todos os campos da memória.");
                return;
            }

            let memorias = JSON.parse(localStorage.getItem('memoria_viva_memorias')) || [];
            memorias.unshift({ ano, titulo, descricao });
            localStorage.setItem('memoria_viva_memorias', JSON.stringify(memorias));

            fecharModal();
            carregarMemorias();
        }

        function excluirMemoria(index) {
            if (confirm("Deseja realmente excluir esta memória?")) {
                let memorias = JSON.parse(localStorage.getItem('memoria_viva_memorias')) || [];
                memorias.splice(index, 1);
                localStorage.setItem('memoria_viva_memorias', JSON.stringify(memorias));
                carregarMemorias();
            }
        }

        window.onload = carregarMemorias;
    </script>
</body>
</html>
