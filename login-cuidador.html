<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memória Viva - Login Cuidador</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="img/logo.png" alt="Logo Memória Viva" onerror="this.style.display='none'">
            <span>Memória Viva</span>
        </div>
    </header>

    <div class="main-container">
        <p style="text-align: center; color: #555; margin-bottom: 5px; font-weight: 500;">ÁREA EXCLUSIVA,</p>
        <h1 style="font-size: 2rem; margin-bottom: 25px; text-align: center; color: var(--text-color);">LOGIN CUIDADOR:</h1>

        <form id="form-login-cuidador">
            <input type="text" id="login-c-nome" placeholder="E-mail ou Nome" required>
            <input type="password" id="login-c-senha" placeholder="Senha" required>
            
            <button type="submit" class="btn-primary">Entrar no Painel</button>
        </form>

        <div class="auth-links">
            <a href="index.html">Voltar para o Login do Paciente</a>
        </div>
    </div>

    <footer>
        &copy; 2026 Memória Viva. Todos os direitos reservados.
    </footer>

</body>
</html>
