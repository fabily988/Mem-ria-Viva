<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memória Viva - Álbum de Família</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background-color: #faf5ed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .album-pagina-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            max-width: 480px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }
        .titulo-pagina {
            font-family: 'Brush Script MT', cursive, sans-serif;
            font-size: 2.8rem;
            color: #b05c9a;
            text-align: center;
            margin-bottom: 10px;
        }
        /* O Livro */
        .livro-card {
            background-color: #4a919e;
            width: 100%;
            max-width: 340px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            border: 3px solid #38707a;
        }
        .livro-cabecalho {
            background-color: #ab66ca;
            color: white;
            text-align: center;
            padding: 12px;
            font-size: 1.3rem;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        .livro-conteudo {
            padding: 25px 20px;
            color: white;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 320px;
            position: relative;
        }
        /* Detalhe da lombada do livro */
        .livro-conteudo::before {
            content: "";
            position: absolute;
            left: 20px;
            top: 15px;
            bottom: 15px;
            width: 4px;
            background-color: rgba(255,255,255,0.4);
            border-radius: 2px;
        }
        .livro-foto {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid white;
            margin-bottom: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .livro-nome {
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 4px;
        }
        .livro-parentesco {
            font-size: 1.1rem;
            background-color: rgba(255,255,255,0.2);
            padding: 3px 12px;
            border-radius: 12px;
            margin-bottom: 10px;
            display: inline-block;
        }
        .livro-descricao {
            font-size: 0.95rem;
            line-height: 1.4;
            padding: 0 10px;
        }
        /* Controles de Navegação (Setas) */
        .btn-pagina {
            background: none;
            border: none;
            font-size: 2.5rem;
            font-weight: bold;
            color: #333;
            cursor: pointer;
            padding: 0 15px;
            transition: transform 0.2s;
        }
        .btn-pagina:hover {
            transform: scale(1.1);
            color: #b05c9a;
        }
        .btn-pagina:disabled {
            opacity: 0.2;
            cursor: default;
            transform: none;
        }
        /* Botões de Ação do Cuidador */
        .botoes-acao {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            width: 100%;
            max-width: 340px;
        }
        .btn-acao {
            flex: 1;
            background-color: #ab66ca;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: center;
            text-decoration: none;
        }
        .btn-acao:hover {
            background-color: #9a53b5;
        }
        .btn-voltar-home {
            margin-top: 15px;
            color: #555;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
        }

        /* Garante visibilidade das dicas internas nos inputs */
        #modal-adicionar input::placeholder,
        #modal-adicionar textarea::placeholder {
            color: #555555 !important;
            opacity: 1 !important;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container" style="flex-direction: row; gap: 10px; margin: 0;">
            <img src="img/logo.png" alt="Logo" style="width: 40px; margin: 0;" onerror="this.style.display='none'">
            <span style="font-size: 1.2rem;">Memória Viva</span>
        </div>
        <a href="home-paciente.html" style="color: var(--primary-color); text-decoration: none; font-weight: bold; font-size: 0.9rem;">Voltar</a>
    </header>

    <div class="album-pagina-container">
        <h1 class="titulo-pagina">Minha família</h1>

        <!-- O Livro / Álbum -->
        <div style="display: flex; align-items: center; gap: 10px; width: 100%; justify-content: center;">
            <button class="btn-pagina" id="btn-voltar-pagina" onclick="mudarPagina(-1)">&#10094;</button>
            
            <div class="livro-card">
                <div class="livro-cabecalho">Álbum de fotos</div>
                <div class="livro-conteudo" id="conteudo-pagina">
                    <!-- Conteúdo gerado dinamicamente via JS -->
                </div>
            </div>

            <button class="btn-pagina" id="btn-avancar-pagina" onclick="mudarPagina(1)">&#10095;</button>
        </div>

        <!-- Botões inferiores -->
        <div class="botoes-acao">
            <button class="btn-acao" onclick="abrirModal()">+ Adicionar familiar</button>
            <button class="btn-acao" style="background-color: #d9534f;" onclick="removerFamiliarAtual()">Remover familiar</button>
        </div>

        <a href="home-paciente.html" class="btn-voltar-home">← Voltar ao Início</a>
    </div>

    <!-- Modal Pop-up para Upload Local -->
    <div id="modal-adicionar" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center;">
        <div style="background: #ffffff !important; padding: 20px; border-radius: 12px; max-width: 320px; width: 90%; display: flex; flex-direction: column; gap: 10px;">
            <h3 style="color: #4A9B9B !important; text-align: center; margin: 0;">Adicionar Familiar</h3>
            
            <input type="text" id="add-nome" placeholder="Nome do familiar" style="background: #ffffff !important; color: #000000 !important; border: 1px solid #777777 !important; padding: 10px !important; border-radius: 8px !important; font-size: 0.95rem !important;">
            <input type="text" id="add-parentesco" placeholder="Grau de parentesco (ex: Filha, Neto)" style="background: #ffffff !important; color: #000000 !important; border: 1px solid #777777 !important; padding: 10px !important; border-radius: 8px !important; font-size: 0.95rem !important;">
            <textarea id="add-descricao" placeholder="Breve lembrança..." style="background: #ffffff !important; color: #000000 !important; border: 1px solid #777777 !important; padding: 10px !important; border-radius: 8px !important; height: 60px !important; font-family: inherit !important; font-size: 0.95rem !important;"></textarea>
            
            <label style="font-size: 0.85rem; font-weight: bold; color: #333333 !important;">Foto do familiar:</label>
            <input type="file" id="add-foto-file" accept="image/*" style="background: transparent !important; color: #333333 !important; padding: 0 !important; border: none !important;">

            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button onclick="salvarNovoFamiliar()" class="btn-acao" style="background: #2e7d32 !important;">Salvar</button>
                <button onclick="fecharModal()" class="btn-acao" style="background: #888888 !important;">Cancelar</button>
            </div>
        </div>
    </div>

    <footer>
        &copy; 2026 Memória Viva. Todos os direitos reservados.
    </footer>

    <script>
        const fotoPadrao = "https://via.placeholder.com/130?text=Sem+Foto";

        let paginasAlbum = JSON.parse(localStorage.getItem('memoria_viva_familia')) || [
            {
                tipo: "capa",
                titulo: "Contém fotos da sua família e o contato de cada um ♡",
                sub: "Clique no ícone > para abrir"
            },
            {
                tipo: "familiar",
                nome: "Ana Clara",
                parentesco: "Filha mais velha",
                descricao: "Mora perto e sempre traz pão de queijo aos domingos.",
                foto: fotoPadrao
            },
            {
                tipo: "fim",
                titulo: "Chegamos ao fim ♡",
                sub: "Clique no ícone < para voltar ao início"
            }
        ];

        let paginaAtual = 0;

        function renderizarPagina() {
            const container = document.getElementById('conteudo-pagina');
            const item = paginasAlbum[paginaAtual];

            if (item.tipo === "capa" || item.tipo === "fim") {
                container.innerHTML = `
                    <div style="font-size: 1.35rem; line-height: 1.5; font-weight: 500; margin-bottom: 25px; padding-left: 15px;">
                        ${item.titulo}
                    </div>
                    <div style="font-size: 0.95rem; font-style: italic; opacity: 0.9; margin-top: auto;">
                        ${item.sub}
                    </div>
                `;
            } else {
                container.innerHTML = `
                    <img src="${item.foto}" class="livro-foto" alt="${item.nome}">
                    <div class="livro-nome">${item.nome}</div>
                    <div class="livro-parentesco">${item.parentesco}</div>
                    <div class="livro-descricao">${item.descricao}</div>
                `;
            }

            document.getElementById('btn-voltar-pagina').disabled = (paginaAtual === 0);
            document.getElementById('btn-avancar-pagina').disabled = (paginaAtual === paginasAlbum.length - 1);
        }

        function mudarPagina(direcao) {
            paginaAtual += direcao;
            if (paginaAtual < 0) paginaAtual = 0;
            if (paginaAtual >= paginasAlbum.length) paginaAtual = paginasAlbum.length - 1;
            renderizarPagina();
        }

        function abrirModal() {
            document.getElementById('modal-adicionar').style.display = 'flex';
        }

        function fecharModal() {
            document.getElementById('modal-adicionar').style.display = 'none';
            document.getElementById('add-nome').value = '';
            document.getElementById('add-parentesco').value = '';
            document.getElementById('add-descricao').value = '';
            document.getElementById('add-foto-file').value = '';
        }

        function salvarNovoFamiliar() {
            const nome = document.getElementById('add-nome').value.trim();
            const parentesco = document.getElementById('add-parentesco').value.trim();
            const descricao = document.getElementById('add-descricao').value.trim();
            const fileInput = document.getElementById('add-foto-file');
            const arquivo = fileInput.files[0];

            if (!nome) {
                alert("Por favor, informe o nome do familiar.");
                return;
            }

            if (arquivo) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    adicionarEGuardar(nome, parentesco, descricao, e.target.result);
                };
                reader.readAsDataURL(arquivo);
            } else {
                adicionarEGuardar(nome, parentesco, descricao, fotoPadrao);
            }
        }

        function adicionarEGuardar(nome, parentesco, descricao, foto) {
            const novoFamiliar = { tipo: "familiar", nome, parentesco, descricao, foto };
            paginasAlbum.splice(paginasAlbum.length - 1, 0, novoFamiliar);
            localStorage.setItem('memoria_viva_familia', JSON.stringify(paginasAlbum));

            fecharModal();
            paginaAtual = paginasAlbum.length - 2;
            renderizarPagina();
        }

        function removerFamiliarAtual() {
            const item = paginasAlbum[paginaAtual];
            if (item.tipo === "capa" || item.tipo === "fim") {
                alert("Você não pode remover as páginas de capa ou fim.");
                return;
            }

            if (confirm(`Deseja remover ${item.nome}?`)) {
                paginasAlbum.splice(paginaAtual, 1);
                localStorage.setItem('memoria_viva_familia', JSON.stringify(paginasAlbum));
                if (paginaAtual >= paginasAlbum.length) {
                    paginaAtual = paginasAlbum.length - 1;
                }
                renderizarPagina();
            }
        }

        window.onload = renderizarPagina;
    </script>
</body>
</html>
