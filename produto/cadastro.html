<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memória Viva - Cadastro</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .opcao-grupo {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
            cursor: pointer;
        }
        .opcao-grupo input[type="radio"] {
            width: auto !important;
            margin: 0;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="img/logo.png" alt="Logo Memória Viva" onerror="this.style.display='none'">
            <span>Memória Viva</span>
        </div>
    </header>

    <div class="main-container">
        <p style="color: #555; margin-bottom: 5px; font-weight: 500;">BEM-VINDO AO MEMÓRIA VIVA,</p>
        <h1 style="font-size: 2rem; margin-bottom: 25px;">CADASTRO:</h1>

        <form id="form-cadastro">
            <input type="text" id="cad-nome" placeholder="Nome" required>
            <input type="email" id="cad-email" placeholder="E-mail" required>
            <input type="password" id="cad-senha" placeholder="Senha" required>
            
            <div style="color: #444; font-size: 0.95rem; margin-top: 5px; text-align: left; width: 100%;">
                <label style="font-weight: bold;">Você é:</label>

                <label class="opcao-grupo">
                    <input type="radio" id="tipo-paciente" name="tipo-usuario" value="paciente" checked>
                    <span>Paciente</span>
                </label>

                <label class="opcao-grupo">
                    <input type="radio" id="tipo-cuidador" name="tipo-usuario" value="cuidador">
                    <span>Cuidador</span>
                </label>
            </div>

            <button type="submit" class="btn-primary" style="margin-top: 15px;">Cadastrar</button>
        </form>

        <div class="auth-links">
            <a href="index.html">Já tem uma conta? Faça login aqui</a>
        </div>
    </div>

    <footer>
        &copy; 2026 Memória Viva. Todos os direitos reservados.
    </footer>

    <script>
        document.getElementById('form-cadastro').addEventListener('submit', function(e) {
            e.preventDefault();

            const nome = document.getElementById('cad-nome').value.trim();
            const email = document.getElementById('cad-email').value.trim();
            const senha = document.getElementById('cad-senha').value;
            const tipo = document.querySelector('input[name="tipo-usuario"]:checked').value;

            let usuarios = JSON.parse(localStorage.getItem('memoria_viva_usuarios')) || [];

            if (usuarios.some(u => u.email.toLowerCase() === email.toLowerCase())) {
                alert('Este e-mail já está cadastrado!');
                return;
            }

            const codigoVinculoGerado = (tipo === 'paciente') ? Math.floor(100000 + Math.random() * 900000).toString() : '';

            usuarios.push({ 
                nome, 
                usuario: nome, 
                email, 
                senha, 
                tipo,
                perfil: tipo, 
                codigoVinculo: codigoVinculoGerado 
            });

            localStorage.setItem('memoria_viva_usuarios', JSON.stringify(usuarios));

            if (tipo === 'paciente') {
                localStorage.removeItem(`memoria_viva_cuidador_vinculado_${nome}`);
                localStorage.removeItem(`memoria_viva_nome_cuidador_ativo_${nome}`);
            }

            alert('Cadastro realizado com sucesso! Faça seu login.');
            
            if (tipo === 'paciente') {
                window.location.href = 'index.html';
            } else {
                window.location.href = 'login-cuidador.html';
            }
        });
    </script>
</body>
</html>
</html>
